version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: antcantu/fumbld-ai:v1.0.0
    container_name: fumbld_backend
    env_file:
      - ./source/.env
    volumes:
      - ./source:/app
    expose:
      - "8000"
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    container_name: fumbld_frontend
    ports:
      - "80:80"
      - "443:443" # enable for HTTPS in production
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./source/static:/app/static
      - certs:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    depends_on:
      - backend
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    container_name: fumbld_certbot
    volumes:
      - certs:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: ""
    command: >
      certonly --webroot --webroot-path=/var/www/certbot 
      --email your@email.com --agree-tos --no-eff-email 
      -d yourdomain.com -d www.yourdomain.com
    depends_on:
      - frontend

  db:
    image: postgres:15
    container_name: fumbld_db
    env_file:
      - ./source/.env
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

volumes:
  pgdata:
  certs:
  certbot-www:
