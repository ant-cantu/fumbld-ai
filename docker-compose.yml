version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: antcantu/fumbld-ai:v1.0.0
    container_name: fumbld_backend
    env_file:
      - ./source/.env
    volumes:
      - ./source:/app
      - ./logs:/app/logs
    expose:
      - "8000"
    depends_on:
      - db
      - redis
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    container_name: fumbld_frontend
    ports:
      - "80:80"
      - "443:443" # enable for HTTPS in production
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./source/static:/app/static
      - ./certs:/etc/letsencrypt
      - ./certbot-www:/var/www/certbot
    depends_on:
      - backend
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    container_name: fumbld_certbot
    entrypoint: ["certbot"]
    volumes:
      - ./certs:/etc/letsencrypt
      - ./certbot-www:/var/www/certbot
    command: certonly --webroot --webroot-path=/var/www/certbot 
            --email fumbldai@outlook.com --agree-tos --no-eff-email 
            -d fumbldai.com -d www.fumbldai.com
    depends_on:
      - frontend

  redis:
    image: redis:7-alpine
    container_name: fumbld_redis
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  db:
    image: postgres:15
    container_name: fumbld_db
    env_file:
      - ./source/.env
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
  redis_data:
