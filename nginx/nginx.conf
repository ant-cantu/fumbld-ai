# Trusted Cloudflare IPs (optional for logging or real_ip_header)
real_ip_header CF-Connecting-IP;
set_real_ip_from 0.0.0.0/0;
set_real_ip_from ::/0;

# Rate limiting
limit_req_zone $binary_remote_addr zone=rate_limit_zone:10m rate=10r/s;

server {
    listen 80;
    server_name fumbldai.com www.fumbldai.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name fumbldai.com www.fumbldai.com;

    ssl_certificate /etc/letsencrypt/live/fumbldai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fumbldai.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256';
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1h;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 1.0.0.1 valid=300s;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "no-referrer-when-downgrade";

    # TEMP: Allow inline + any secure (https:) external content for testing
    add_header Content-Security-Policy "default-src 'self' https:; script-src 'self' 'unsafe-inline' https://www.google.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https:;";


    location / {
        # Rate limiting for API
        limit_req zone=rate_limit_zone burst=100 delay=5;

        proxy_pass http://fumbld_backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Accept-Encoding "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /app/static/;
    }

    # Block potentially dangerous paths
    location ~* /(wp-admin|wp-login|xmlrpc\.php|setup-config\.php|\.git|\.env|\.htaccess) {
        return 444;
    }

    # Custom error page
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
