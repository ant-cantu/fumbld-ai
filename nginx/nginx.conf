# Redirect all non-Cloudflare IPs to 444 (drop silently)
geo $allow_cloudflare {
  default 0;
  103.21.244.0/22 1;
  103.22.200.0/22 1;
  103.31.4.0/22 1;
  104.16.0.0/13 1;
  104.24.0.0/14 1;
  108.162.192.0/18 1;
  131.0.72.0/22 1;
  141.101.64.0/18 1;
  162.158.0.0/15 1;
  172.64.0.0/13 1;
  173.245.48.0/20 1;
  188.114.96.0/20 1;
  190.93.240.0/20 1;
  197.234.240.0/22 1;
  198.41.128.0/17 1;
}

map $allow_cloudflare $block {
  0 1;
  1 0;
}

set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;

real_ip_header CF-Connecting-IP;

limit_req_zone $binary_remote_addr zone=rate_limit_zone:10m rate=10r/s;

server {
    listen 80;
    server_name fumbldai.com www.fumbldai.com;

    if ($block) {
        return 444;
    }

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name fumbldai.com www.fumbldai.com;

    if ($block) {
        return 444;
    }

    ssl_certificate /etc/letsencrypt/live/fumbldai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fumbldai.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256';
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1h;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 1.0.0.1 valid=300s;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "no-referrer-when-downgrade";
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';";

    # Rate limiting
    limit_req zone=rate_limit_zone burst=20 nodelay;

    location / {
        proxy_pass http://fumbld_backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /app/static/;
    }

    # Block access to known unwanted paths
    location ~* /(wp-admin|wp-login|xmlrpc\.php|setup-config\.php|\.git|\.env|\.htaccess) {
        return 444;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
