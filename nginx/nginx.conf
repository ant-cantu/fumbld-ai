server {
    listen 80;
    server_name fumbldai.com www.fumbldai.com;

    location / {
        proxy_pass http://fumbld_backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /app/static/;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

server {
    listen 80;
    server_name fumbldai.com www.fumbldai.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name fumbldai.com www.fumbldai.com;

    ssl_certificate /etc/letsencrypt/live/fumbldai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fumbldai.com/privkey.pem;

    location / {
        proxy_pass http://fumbld_backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /app/static/;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}


