# HTTP
server {
    listen 80;
    server_name fumbldai.com www.fumbldai.com;

    location / {
        root /app/static;
        index index.html;
        try_files $uri /index.html;
    }

    location ~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}


