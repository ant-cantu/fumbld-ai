services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: antcantu/fumbld-ai:v1.0.0
    container_name: fumbld_backend
    env_file:
      - ./source/.env
    volumes:
      - ./source:/app
    expose:
      - "8000"
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    container_name: fumbld_frontend
    ports:
    - "80:80"
    volumes:
      - ./nginx/nginx.local.conf:/etc/nginx/conf.d/default.conf
      - ./source/static:/app/static
    depends_on:
      - backend
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: fumbld_redis
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  db:
    image: postgres:15
    container_name: fumbld_db
    env_file:
      - ./source/.env
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

volumes:
  pgdata:
  redis_data: